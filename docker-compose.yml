services:
  nginx:
    image: nginx:alpine
    container_name: assessment-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assessment-app
    expose:
      - "5000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge